<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
  html, body {
    margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
    color: #f2f3f7;
    -webkit-user-select: none; user-select: none;
  }
  #card {
    box-sizing: border-box; height: 100%; padding: 10px 14px 12px;
    border-radius: 16px;
    background: linear-gradient(160deg, rgba(40, 42, 50, 0.64), rgba(22, 23, 29, 0.60));
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.36), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    -webkit-backdrop-filter: blur(20px) saturate(1.18);
    backdrop-filter: blur(20px) saturate(1.18);
    display: flex; flex-direction: column; gap: 4px;
    opacity: 0; transform: translateY(3px);
    transition: opacity 220ms ease, transform 220ms ease;
  }
  body.on #card { opacity: 1; transform: none; }
  .row { display: flex; align-items: center; gap: 7px; min-width: 0; flex: none; }
  #dot {
    flex: none; width: 6px; height: 6px; border-radius: 50%;
    background: #7ee2a8; box-shadow: 0 0 0 3px rgba(126, 226, 168, 0.16);
  }
  body.paused #dot { background: #f0b429; box-shadow: 0 0 0 3px rgba(240, 180, 41, 0.16); }
  #status {
    font-size: 11px; line-height: 1.4; letter-spacing: 0.2px;
    color: rgba(242, 243, 247, 0.64);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #line {
    flex: 1 1 auto; min-height: 0;
    font-size: 13.5px; line-height: 1.42; color: #f8f9fc;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden; overflow-wrap: anywhere;
  }
</style>
</head>
<body>
  <div id="card">
    <div class="row"><span id="dot"></span><span id="status"></span></div>
    <div id="line"></div>
  </div>
</body>
</html>
